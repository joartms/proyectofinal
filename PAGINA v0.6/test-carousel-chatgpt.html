<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrusel múltiple</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#f5f5f5;
    font-family:Arial;
}

.carousel{
    width:900px;
    overflow:hidden;
    position:relative;
}

.slides{
    display:flex;
    transition:0.5s;
}

.slide{
    min-width:300px;
    margin:10px;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.slide img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.slide h2{
    padding:15px;
    text-align:center;
}

button{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:black;
    color:white;
    border:none;
    padding:15px;
    cursor:pointer;
    font-size:20px;
    z-index:10;
}

.prev{
    left:0;
}

.next{
    right:0;
}

</style>
</head>

<body>

<div class="carousel">

    <button class="prev" onclick="prevSlide()">❮</button>

    <div class="slides" id="slides">

        <div class="slide">
            <img src="https://picsum.photos/id/1015/300/200">
            <h2>Producto 1</h2>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1016/300/200">
            <h2>Producto 2</h2>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1018/300/200">
            <h2>Producto 3</h2>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1020/300/200">
            <h2>Producto 4</h2>
        </div>

        <div class="slide">
            <img src="https://picsum.photos/id/1024/300/200">
            <h2>Producto 5</h2>
        </div>

    </div>

    <button class="next" onclick="nextSlide()">❯</button>

</div>

<script>

let index = 0;

const slides = document.getElementById("slides");

function nextSlide(){

    index++;

    slides.style.transform =
    `translateX(-${index * 320}px)`;

}

function prevSlide(){

    if(index > 0){

        index--;

        slides.style.transform =
        `translateX(-${index * 320}px)`;

    }
}

</script>

</body>
</html>
