<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicia</title>

    <!-- STYLES -->

    <link rel="stylesheet" href="../CSS/header-footer.css">
    <link rel="stylesheet" href="../CSS/inicio-sesion.css">

    <!-- FAVICON -->

    <link rel="icon" type="png" href="../IMG/favicon.png">

    <!-- FONTS -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gravitas+One&family=Hedvig+Letters+Sans&family=Hedvig+Letters+Serif:opsz@12..24&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

</head>
<body>
    <!-- HEADER -->

    <header>
        <div class="header">
            <div class="nombre">
                <img class="logo" src="../IMG/logo_sin_espacio_alrededor.png" alt="Logo">
            </div>
            <nav class="nav">
                <ul class="lista">
                    <li class="item-lista">
                        <a class="item" href="">Sobre Nosotros</a>
                        <div class="linea-link"></div>
                    </li>
                    <li class="item-lista">
                        <a class="item" href="">Productos</a>
                        <div class="linea-link"></div>
                    </li>
                    <li class="item-lista">
                        <a class="item" href="">Contacto</a>
                        <div class="linea-link"></div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- MAIN -->

    <main>
        <div class="contenedor-principal">
            <div class="black-background">
                <div class="contenedor">
                    <div class="caja">
                        <div class="inicio-sesion">
                            <h2 class="titulo">Iniciar Sesión</h2>
                            <h4 class="subtitulo">Para finalizar el proceso, le solicitamos completar algunos campos adicionales.</h4>
                            <div class="form">
                                <div class="dos-inputs">
                                    <div class="input">
                                        <input type="text" placeholder="Nombre">
                                    </div>
                                    <div class="input">
                                        <input type="text" placeholder="Apellido">
                                    </div>
                                </div>
                                <div class="input">
                                    <input type="email" placeholder="Email">
                                </div>
                                <div class="dos-inputs">
                                    <div class="input">
                                        <input type="text" placeholder="País">
                                    </div>
                                    <div class="input">
                                        <input type="text" placeholder="Ciudad">
                                    </div>
                                </div>
                                <div class="input">
                                    <input type="date">
                                </div>
                                <div class="input">
                                    <input type="number" placeholder="DNI">
                            </div>
                            </div> 
                            <div class="contenedor-button">
                                <button class="enviar">🡆</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->

    <footer>
        <div class="columnas">
            <div>
                <h4 class="subtitulo-footer">Contacto</h4>
                <div class="gmail">
                    <img class="footer-icon" src="../IMG/gmail-icon.png" alt="icono de gmail">
                    <div>
                        <h5>Gmail:</h5>
                        <h6>email@gmail.com</h6>
                    </div>
                </div>
                <div class="telefono">
                    <img class="footer-icon" src="../IMG/telefono-icon.png" alt="icono de telefono">
                    <div>
                        <h5>Teléfono:</h5>
                        <h6>+5493364010101</h6>
                    </div>
                </div>
            </div>
            <div>
                <h4 class="subtitulo-footer">Síguenos en<br>nuestras redes!</h4>
                <div class="instagram">
                    <img class="footer-icon" src="../IMG/instagram-icon.png" alt="icono de instagram">
                    <div>
                        <h5>Instagram:</h5>
                        <h6>instagram.user</h6>
                    </div>
                </div>
            </div>
        </div>
        <div class="frase-final">
            <div>
                <h4 class="delicia">Delicia</h4>
                <h5>Gente que hornea contenta.</h5>
            </div>
        </div>
    </footer>
</body>
</html>
